        <text x="52" y="572" class="tm">board · rollup · rules · update · cleanup</text>
        <rect x="488" y="468" width="176" height="92" rx="10" class="b"/>
        <text x="576" y="494" text-anchor="middle" class="tt">herdr server</text>
