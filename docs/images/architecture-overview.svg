        <rect x="464" y="638" width="200" height="78" rx="10" class="b-teal"/>
        <text x="480" y="661" class="tb">worker · <tspan class="c-cc">claude</tspan></text>
        <text x="480" y="682" class="tm">task/&lt;slug&gt;-docs</text>
        <text x="480" y="702" class="ts">自己的 pane + worktree</text>

