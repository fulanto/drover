        <text x="48" y="702" class="ts">自己的 pane + worktree</text>
        <rect x="248" y="638" width="200" height="78" rx="10" class="b-teal"/>
        <text x="264" y="661" class="tb">worker · <tspan class="c-teal">codex</tspan></text>
        <text x="264" y="682" class="tm">task/&lt;slug&gt;-ui</text>
