        <rect x="16" y="604" width="664" height="124" rx="16" class="frame"/>
        <text x="32" y="626" class="tm c-muted">herdr · worktree workspaces（一个条目一个 worktree + 一个 worker）</text>
        <rect x="32" y="638" width="200" height="78" rx="10" class="b-teal"/>
